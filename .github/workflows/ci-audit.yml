name: CI audit

# Every Monday, the CI's numbers over the last 28 days (ci-audit/report.sh): push → verdict
# latency, wait / setup / run per job, critical path, flakes and runner minutes, in the run's
# summary. Read-only: it touches nothing but the API.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          filter: blob:none

      - name: Install DuckDB
        run: |
          curl -fsSLo duckdb.tar.gz https://github.com/duckdb/duckdb/releases/download/v2.0.1/duckdb-cli-linux-amd64.tar.gz
          echo "b676268be4d39e4e41a904442c9796c9914e645cc085c7505f048f2c992b5eca  duckdb.tar.gz" | sha256sum -c -
          tar -xzf duckdb.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          after=$(date -u -d '-28 days' +%Y-%m-%d)
          ci-audit/fetch.sh 28
          {
            echo "# CI audit since $after"
            ci-audit/report.sh --no-fetch --after "$after"
            ci-audit/report.sh --no-fetch --after "$after" --workflow TestFlight | sed -n '/PR latency/,/Per job/p' | sed '$d'
          } | tee -a "$GITHUB_STEP_SUMMARY"
