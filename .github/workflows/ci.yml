name: CI

# Builds the app and runs SHARPIT-APPTests on a simulator, on each push to main and each pull
# request. No signing: CI needs no team, and Config/Local.xcconfig (gitignored) is an optional
# include, so the Debug build reaches its default origins.
on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The project's format needs a recent Xcode: take the newest the runner has.
      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/ci/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('SHARPIT-APP.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Pick a simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          test -n "$UDID" && test "$UDID" != "null"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          set -o pipefail
          # One simulator worker: parallel clones were dying mid-suite (hundreds of
          # 0.000 s "failures") on macos-26 after the calendar-providers merge.
          xcodebuild test \
            -project SHARPIT-APP.xcodeproj \
            -scheme SHARPIT-APP \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData/ci \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log | grep -E "error:|✘|Test run with|TEST (SUCCEEDED|FAILED)"

      # A compiler crash prints no `error:` line, only « Command SwiftCompile failed »: show the
      # diagnostics, the crash and the end of the log so the cause is readable in the job.
      - name: Show why the build failed
        if: failure()
        run: |
          grep -nE "error:|fatal error|Assertion|Abort|Segmentation" xcodebuild.log | head -80 || true
          # A crash: what the compiler was doing (the declaration and file it names), not its addresses.
          # The crash's numbered context lines (« While emitting … », « for 'x' at file:line »),
          # not the file list nor the addresses.
          awk '/Stack dump:/{on=1} on' xcodebuild.log | grep -E "^[0-9]+\.|for |While |at /" | grep -vE "0x[0-9a-f]{8,}" | head -60 || true

      - name: Upload the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
