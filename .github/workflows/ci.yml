name: CI

# Builds the app and cold-launches it on a simulator, on each push to main and each pull request.
# The unit tests run before each push, in .githooks/pre-push (scripts/pre-push.sh), not here.
# No signing: CI needs no team, and Config/Local.xcconfig (gitignored) is an optional include,
# so the Debug build reaches its default origins.
on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          filter: blob:none

      # The project's format needs a recent Xcode: take the newest the runner has. Its build
      # version keys the compilation cache, since another compiler cannot reuse its outputs.
      - name: Select the newest Xcode
        id: xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          echo "build=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"

      # Caches are written by main only and restored read-only everywhere else, so a pull
      # request can never plant an output that main would then reuse.
      - name: Restore Swift packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/ci/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-spm-${{ hashFiles('SHARPIT-APP.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Xcode's compilation cache is content-addressed: an output is reused only for the exact
      # inputs that produced it, so a stale cache costs time, never correctness. Any earlier
      # main's cache is a valid starting point, hence the prefix fallback.
      - name: Restore the compilation cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/ci/CompilationCache.noindex
          key: ${{ runner.os }}-${{ runner.arch }}-cas-${{ steps.xcode.outputs.build }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cas-${{ steps.xcode.outputs.build }}-

      - name: Pick a simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          test -n "$UDID" && test "$UDID" != "null"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # A cold boot takes minutes on the runner: start it now so it overlaps the build.
          # smoke-launch.sh waits for it (bootstatus) before installing.
          nohup xcrun simctl boot "$UDID" > simulator-boot.log 2>&1 &

      # Unit tests never cold-launch the app: a crash at launch only shows when it is opened.
      - name: Cold-launch smoke test
        run: |
          # An unsigned app dies at launch on Clerk's Keychain (-34018): the simulator reads the
          # entitlements linked into the binary, so a signature added afterwards is not enough.
          # Rebuild signed to run locally, as Xcode does.
          set -o pipefail
          xcodebuild build \
            -project SHARPIT-APP.xcodeproj \
            -scheme SHARPIT-APP \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData/ci \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            | tee xcodebuild.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
          APP=~/Library/Developer/Xcode/DerivedData/ci/Build/Products/Debug-iphonesimulator/SharpIt.app
          scripts/smoke-launch.sh "${{ steps.simulator.outputs.udid }}" "$APP"

      - name: Save Swift packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/ci/SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-spm-${{ hashFiles('SHARPIT-APP.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Save the compilation cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData/ci/CompilationCache.noindex
          key: ${{ runner.os }}-${{ runner.arch }}-cas-${{ steps.xcode.outputs.build }}-${{ github.sha }}

      # A compiler crash prints no `error:` line, only « Command SwiftCompile failed »: show the
      # diagnostics, the crash and the end of the log so the cause is readable in the job.
      - name: Show why the build failed
        if: failure()
        run: |
          grep -nE "error:|fatal error|Assertion|Abort|Segmentation" xcodebuild.log | head -80 || true
          # A crash: what the compiler was doing (the declaration and file it names), not its addresses.
          # The crash's numbered context lines (« While emitting … », « for 'x' at file:line »),
          # not the file list nor the addresses.
          awk '/Stack dump:/{on=1} on' xcodebuild.log | grep -E "^[0-9]+\.|for |While |at /" | grep -vE "0x[0-9a-f]{8,}" | head -60 || true

      - name: Upload the build log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xcodebuild-log
          path: xcodebuild.log
