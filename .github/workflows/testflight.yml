name: TestFlight

# Archives the app and uploads it to App Store Connect, where TestFlight picks it up: after CI
# passed on main, or by hand (Actions › TestFlight › Run workflow, any branch). A main that
# changed nothing shipped in the app since the last upload (CI, hooks, scripts, docs:
# scripts/ships-in-app.sh) uploads nothing; a run by hand always uploads.
#
# Signing is automatic: xcodebuild manages the profiles and the cloud distribution certificate
# with an App Store Connect API key (Admin role), and signs the archive with one development
# certificate kept in the secrets. Without it, each run's fresh machine had Xcode create a new
# certificate, until the account hit its limit and every archive failed. Repository secrets:
#   SIGNING_CERT_P12       the development certificate and its key, a .p12 in base64
#   SIGNING_CERT_PASSWORD  that .p12's password (both expire with the certificate, after a year)
#   ASC_KEY_ID      the key's ID (App Store Connect › Users and Access › Integrations)
#   ASC_ISSUER_ID   the issuer ID shown on the same page
#   ASC_KEY_P8      the contents of AuthKey_<ID>.p8, pasted whole
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One upload at a time, none cancelled: a build half-uploaded is worse than one queued.
concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  changes:
    # From CI only when it passed on a push to main — never for a pull request's run.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ship: ${{ steps.ship.outputs.ship }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          filter: blob:none

      # Compared with the last main this workflow finished on: a run that uploaded nothing
      # counts, since nothing shipped changed up to it either.
      - name: Did anything shipped change since the last upload
        id: ship
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh run list -R "$GITHUB_REPOSITORY" --workflow TestFlight --branch main --status success \
            --limit 1 --json headSha --jq '.[0].headSha // ""')
          ship=$(scripts/ships-in-app.sh "$base" "${{ github.event.workflow_run.head_sha }}")
          echo "ship=$ship" >> "$GITHUB_OUTPUT"
          echo "Since ${base:-nothing}: ship=$ship" | tee -a "$GITHUB_STEP_SUMMARY"

  upload:
    needs: changes
    # `changes` is skipped for a run by hand, which always uploads.
    if: >-
      always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.ship == 'true')
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_P8" || { echo "::error::ASC_KEY_P8 is not set"; exit 1; }
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      # In a keychain of its own, first in the search list, so Xcode finds this certificate
      # instead of asking Apple for a new one.
      - name: Install the signing certificate
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          test -n "$SIGNING_CERT_P12" || { echo "::error::SIGNING_CERT_P12 is not set"; exit 1; }
          test -n "$SIGNING_CERT_PASSWORD" || { echo "::error::SIGNING_CERT_PASSWORD is not set"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Lets codesign use the key without a prompt nobody is there to answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          test "$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c 'Apple Development')" = 1 \
            || { echo "::error::the .p12 holds no valid Apple Development identity"; exit 1; }

      # The build number is the UTC minute, as the hand bumps wrote it (202610231720): always
      # higher than the last, and the same for the app and its widgets.
      - name: Pick the build number
        id: build
        run: echo "number=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SHARPIT-APP.xcodeproj \
            -scheme SHARPIT-APP \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SharpIt.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM=6X5CP5SFAG \
            CURRENT_PROJECT_VERSION=${{ steps.build.outputs.number }} \
            | tee archive.log | grep -E "error:|warning: .*[Ss]ign|ARCHIVE (SUCCEEDED|FAILED)"

      # `Config/ExportOptions.plist` has `destination: upload`: the export is the upload.
      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SharpIt.xcarchive" \
            -exportOptionsPlist Config/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee export.log | grep -E "error:|Upload|EXPORT (SUCCEEDED|FAILED)"

      - name: Summary
        run: |
          {
            echo "### Build ${{ steps.build.outputs.number }} sent to App Store Connect"
            echo "Commit \`${{ github.event.workflow_run.head_sha || github.sha }}\`. TestFlight lists it once Apple has processed it (usually 10–30 min)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show why it failed
        if: failure()
        run: |
          for log in archive.log export.log; do
            test -f "$log" && grep -nE "error:|No signing certificate|provisioning profile|requires a provisioning|not authorized|403" "$log" | head -60 || true
          done

      - name: Upload the logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore

      - name: Remove the key and the certificate
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
